[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silma_tts"
version = "1.0.5"
description = "SILMA TTS: A Lightweight Open Bilingual Text to Speech Model"
readme = "README.md"
license = {text = "MIT License"}
authors = [
  { name="SILMA AI", email="hello@silma.ai" },
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cached_path",
    "click",
    "ema_pytorch>=0.5.2",
    "gradio",
    "hydra-core>=1.3.0",
    "librosa",
    "matplotlib",
    "numpy<=1.26.4",
    "pydub",
    "safetensors",
    "soundfile",
    "tomli",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.21",
    "torchcodec",
    "torchdiffeq",
    "tqdm>=4.65.0",
    "transformers",
    "transformers_stream_generator",
    "unidecode",
    "vocos",
    "x_transformers>=1.31.14",
    "nemo_text_processing==1.1.0",
    "catt_tashkeel==1.0.2"
]


[project.urls]
Homepage = "https://github.com/SILMA-AI/silma-tts"

[project.scripts]
"silma-tts-app" = "silma_tts.app:main"

[tool.setuptools.package-data]
"silma_tts" = ["*.yaml","**/*.wav"]